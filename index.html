<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venture Conclave — Inauguration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --espresso: #231a14;
    --espresso-2: #1a1310;
    --parchment: #efe3ce;
    --parchment-dim: rgba(239, 227, 206, 0.6);
    --cognac: #c1794a;
    --cognac-glow: rgba(193, 121, 74, 0.4);
    --wine: #7a3347;
    --sage: #8a9873;
    --gold: #e29d62;
    --ease: cubic-bezier(.22,.61,.2,1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; width: 100%; }
  body {
    background: var(--espresso);
    color: var(--parchment);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    canvas { display: none !important; }
  }

  /* ---------- Deep Atmosphere Background ---------- */
  .atmosphere {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(65% 55% at 50% 38%, #3e2d21 0%, #1c140f 70%, var(--espresso) 100%),
      var(--espresso);
    transition: background 1.2s var(--ease);
  }
  .atmosphere::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(#ffffff 0.6px, transparent 0.6px);
    background-size: 4px 4px;
    opacity: .035;
    pointer-events: none;
  }
  .atmosphere::after {
    content: "";
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--cognac-glow) 0%, rgba(193, 121, 74, 0) 70%);
    border-radius: 50%;
    opacity: 0.7;
    filter: blur(40px);
    pointer-events: none;
    animation: corePulse 8s ease-in-out infinite alternate;
  }
  @keyframes corePulse {
    0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
    100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.85; }
  }

  /* ---------- Canvas Layers ---------- */
  .hero-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #bg-canvas { z-index: 1; }
  #fg-canvas { z-index: 3; }

  /* ---------- Stage Layout ---------- */
  .flip-container {
    position: relative; z-index: 2;
    height: 100vh; width: 100vw;
    overflow: hidden;
  }
  .flip-panel {
    position: relative; width: 100%; height: 100%;
  }
  .face {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    transition: transform 1s var(--ease), opacity 1s var(--ease);
  }
  .face.front { transform: translateX(0); opacity: 1; z-index: 2; }
  .face.back { transform: translateX(6%); opacity: 0; pointer-events: none; z-index: 2; }
  body.live .face.front { transform: translateX(-6%); opacity: 0; pointer-events: none; }
  body.live .face.back { transform: translateX(0); opacity: 1; pointer-events: auto; }

  /* ---------- Mascot / Stamp ---------- */
  .stamp {
    width: 68px; height: auto;
    margin-bottom: 18px;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));
    opacity: .95;
    transition: transform 0.4s var(--ease);
  }
  .stamp:hover { transform: scale(1.08) rotate(2deg); }
  .face.back .stamp { width: 56px; margin-bottom: 22px; }

  .kicker {
    font-size: 11px; letter-spacing: .2em;
    color: var(--parchment-dim);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  /* ---------- Title & Central Typography ---------- */
  h1.title {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 500; font-optical-sizing: auto;
    font-size: clamp(46px, 7.5vw, 86px);
    line-height: 1.05;
    letter-spacing: -.015em;
    color: var(--parchment);
    text-shadow: 
      0 0 30px rgba(193, 121, 74, 0.4),
      0 0 60px rgba(193, 121, 74, 0.2),
      0 4px 12px rgba(0,0,0,0.8);
    position: relative;
    transition: text-shadow 0.5s ease;
  }
  h1.title:hover {
    text-shadow: 
      0 0 45px rgba(226, 157, 98, 0.75),
      0 0 90px rgba(193, 121, 74, 0.4),
      0 4px 16px rgba(0,0,0,0.9);
  }

  .subtitle {
    margin-top: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; letter-spacing: .16em;
    color: var(--cognac);
    text-transform: uppercase;
    font-weight: 500;
  }

  .meta {
    font-size: 12px; letter-spacing: .09em;
    color: var(--parchment-dim);
    margin-top: 10px;
    margin-bottom: 38px;
  }

  .content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px;
  }

  /* ---------- Front Entrance Choreography ---------- */
  @keyframes riseIn { 
    from { opacity: 0; transform: translateY(22px) scale(0.97); } 
    to { opacity: 1; transform: translateY(0) scale(1); } 
  }
  .face.front .stamp {
    opacity: 0;
    animation: riseIn .9s var(--ease) both, breathe 6s ease-in-out infinite;
    animation-delay: .05s, 1s;
  }
  .face.front .kicker { opacity: 0; animation: riseIn .8s var(--ease) both; animation-delay: .25s; }
  .face.front h1.title { opacity: 0; animation: riseIn .9s var(--ease) both; animation-delay: .4s; }
  .face.front .subtitle { opacity: 0; animation: riseIn .8s var(--ease) both; animation-delay: .6s; }
  .face.front .meta { opacity: 0; animation: riseIn .8s var(--ease) both; animation-delay: .75s; }
  .face.front .cue { 
    opacity: 0; 
    animation: riseIn .8s var(--ease) both, cuePulse 2.8s ease-in-out infinite; 
    animation-delay: .95s, 1.8s; 
  }

  @keyframes cuePulse {
    0%, 100% { border-color: rgba(239, 227, 206, 0.25); box-shadow: 0 0 0 0 rgba(193, 121, 74, 0); }
    50% { border-color: rgba(193, 121, 74, 0.85); box-shadow: 0 0 20px 2px rgba(193, 121, 74, 0.35); }
  }
  @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.02); } }

  .cue {
    background: rgba(35, 26, 20, 0.6); 
    border: 1px solid rgba(239, 227, 206, 0.25); 
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--parchment);
    padding: 16px 32px;
    border-radius: 3px;
    backdrop-filter: blur(8px);
    transition: border-color .4s var(--ease), background .4s var(--ease), transform .3s var(--ease), box-shadow .4s var(--ease);
  }
  .cue:hover { 
    border-color: var(--cognac); 
    background: rgba(193, 121, 74, 0.25); 
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(193, 121, 74, 0.3);
    animation-play-state: paused; 
  }
  .cue:active {
    transform: translateY(1px);
  }

  /* ---------- Back Face Reveal ---------- */
  .quote {
    max-width: 440px;
    margin-top: 24px;
    font-family: 'Fraunces', serif;
    font-style: italic; font-weight: 400;
    font-size: 18px; line-height: 1.6;
    color: var(--parchment-dim);
  }

  .live-tag {
    display: inline-block;
    margin-top: 32px;
    font-size: 11px; letter-spacing: .18em;
    color: var(--sage);
    text-transform: uppercase;
  }
  .live-tag::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--sage);
    margin-right: 9px;
    vertical-align: middle;
    box-shadow: 0 0 10px var(--sage);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(0.8); } }

  .face.back .stamp { opacity: 0; animation: rise .8s var(--ease) both; }
  .face.back .kicker { opacity: 0; animation: rise .7s var(--ease) both; }
  .face.back h1.title { opacity: 0; animation: rise .8s var(--ease) both; }
  .face.back .quote { opacity: 0; animation: rise .8s var(--ease) both; }
  .face.back .live-tag { opacity: 0; animation: rise .7s var(--ease) both; }
  body.live .face.back .stamp { animation-delay: .75s; }
  body.live .face.back .kicker { animation-delay: .95s; }
  body.live .face.back h1.title { animation-delay: 1.1s; }
  body.live .face.back .quote { animation-delay: 1.35s; }
  body.live .face.back .live-tag { animation-delay: 1.6s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- Footer Credits ---------- */
  .credits {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    gap: 28px;
    padding: 20px 20px 24px;
    pointer-events: none;
  }
  .credits img {
    height: 22px; width: auto;
    opacity: .6;
    filter: grayscale(.3) brightness(1.25);
    transition: opacity .3s ease, filter .3s ease;
    pointer-events: auto;
  }
  .credits img:hover {
    opacity: 0.95;
    filter: grayscale(0) brightness(1.4);
  }
  @media (max-width: 640px) {
    .credits { gap: 16px; padding: 14px; }
    .credits img { height: 16px; }
    h1.title { font-size: 40px; }
    .cue { padding: 14px 24px; font-size: 10px; }
  }
</style>
</head>

<script>
  // ---------- Page Interaction Logic ----------
  const cueBtn = document.getElementById('cue');
  cueBtn.addEventListener('click', () => {
    document.body.classList.add('live');
    triggerLaunchBurst();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.body.classList.contains('live')) {
      document.body.classList.add('live');
      triggerLaunchBurst();
    }
  });

  // ---------- Interactive 3D Orbit & Particle Physics Engine ----------
  (function() {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    const bgCanvas = document.getElementById('bg-canvas');
    const fgCanvas = document.getElementById('fg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fgCtx = fgCanvas.getContext('2d');

    let width = 0, height = 0, cx = 0, cy = 0;
    let dpr = window.devicePixelRatio || 1;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      cx = width / 2;
      cy = height / 2;

      bgCanvas.width = width * dpr;
      bgCanvas.height = height * dpr;
      fgCanvas.width = width * dpr;
      fgCanvas.height = height * dpr;

      bgCtx.scale(dpr, dpr);
      fgCtx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // ---------- Mouse Parallax & Spring Motion ----------
    let mouseX = 0, mouseY = 0;
    let camX = 0, camY = 0;
    let speedBoost = 1.0;

    window.addEventListener('mousemove', e => {
      mouseX = (e.clientX / width - 0.5) * 2;
      mouseY = (e.clientY / height - 0.5) * 2;
    });

    const mainTitle = document.getElementById('main-title');
    if (mainTitle) {
      mainTitle.addEventListener('mouseenter', () => { speedBoost = 1.85; });
      mainTitle.addEventListener('mouseleave', () => { speedBoost = 1.0; });
    }

    // ---------- Venture Icon Vector Definitions ----------
    const ICONS = [
      // 1: Rocket (Startup momentum)
      (ctx, size) => {
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.bezierCurveTo(size*0.6, -size*0.4, size*0.6, size*0.4, 0, size);
        ctx.bezierCurveTo(-size*0.6, size*0.4, -size*0.6, -size*0.4, 0, -size);
        ctx.moveTo(-size*0.4, size*0.2); ctx.lineTo(-size*0.8, size*0.8); ctx.lineTo(-size*0.3, size*0.7);
        ctx.moveTo(size*0.4, size*0.2); ctx.lineTo(size*0.8, size*0.8); ctx.lineTo(size*0.3, size*0.7);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -size*0.2, size*0.22, 0, Math.PI * 2); ctx.stroke();
      },
      // 2: Lightbulb (Idea generation)
      (ctx, size) => {
        ctx.beginPath();
        ctx.arc(0, -size*0.2, size*0.55, 0.75 * Math.PI, 0.25 * Math.PI, false);
        ctx.lineTo(size*0.25, size*0.55);
        ctx.lineTo(-size*0.25, size*0.55);
        ctx.closePath(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-size*0.2, size*0.75); ctx.lineTo(size*0.2, size*0.75);
        ctx.moveTo(-size*0.12, size*0.92); ctx.lineTo(size*0.12, size*0.92);
        ctx.stroke();
      },
      // 3: Ascending Growth Chart (Scaling & Capital)
      (ctx, size) => {
        ctx.beginPath();
        ctx.moveTo(-size*0.7, size*0.7); ctx.lineTo(size*0.8, size*0.7);
        ctx.moveTo(-size*0.7, size*0.7); ctx.lineTo(-size*0.7, -size*0.7);
        ctx.moveTo(-size*0.6, size*0.4); ctx.lineTo(-size*0.1, 0); ctx.lineTo(size*0.25, -size*0.2); ctx.lineTo(size*0.7, -size*0.75);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(size*0.35, -size*0.75); ctx.lineTo(size*0.7, -size*0.75); ctx.lineTo(size*0.7, -size*0.4);
        ctx.stroke();
      },
      // 4: Marketplace Bag (Conclave Commerce)
      (ctx, size) => {
        ctx.beginPath();
        ctx.roundRect(-size*0.6, -size*0.2, size*1.2, size*1.0, size*0.15);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, -size*0.2, size*0.35, Math.PI, 0, false);
        ctx.stroke();
      },
      // 5: Atom / Tech Node (Innovation)
      (ctx, size) => {
        ctx.beginPath(); ctx.ellipse(0, 0, size*0.8, size*0.3, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, size*0.8, size*0.3, Math.PI / 3, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, size*0.8, size*0.3, -Math.PI / 3, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, size*0.15, 0, Math.PI * 2); ctx.fill();
      },
      // 6: Shield (Strategy & Security)
      (ctx, size) => {
        ctx.beginPath();
        ctx.moveTo(0, -size*0.8);
        ctx.lineTo(size*0.65, -size*0.5);
        ctx.bezierCurveTo(size*0.65, size*0.2, 0, size*0.8, 0, size*0.9);
        ctx.bezierCurveTo(0, size*0.8, -size*0.65, size*0.2, -size*0.65, -size*0.5);
        ctx.closePath(); ctx.stroke();
      },
      // 7: Globe / Network Node
      (ctx, size) => {
        ctx.beginPath(); ctx.arc(0, 0, size*0.75, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 0, size*0.35, size*0.75, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-size*0.75, 0); ctx.lineTo(size*0.75, 0); ctx.stroke();
      },
      // 8: Coin / Venture Capital 🪙
      (ctx, size) => {
        ctx.beginPath(); ctx.arc(0, 0, size*0.75, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, size*0.55, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-size*0.2, -size*0.3); ctx.lineTo(size*0.2, -size*0.3);
        ctx.moveTo(0, -size*0.3); ctx.lineTo(0, size*0.3);
        ctx.moveTo(-size*0.2, size*0.3); ctx.lineTo(size*0.2, size*0.3);
        ctx.stroke();
      },
      // 9: Diamond / Excellence 💎
      (ctx, size) => {
        ctx.beginPath();
        ctx.moveTo(0, -size*0.8);
        ctx.lineTo(size*0.7, -size*0.3);
        ctx.lineTo(0, size*0.8);
        ctx.lineTo(-size*0.7, -size*0.3);
        ctx.closePath(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-size*0.7, -size*0.3); ctx.lineTo(size*0.7, -size*0.3);
        ctx.moveTo(0, -size*0.8); ctx.lineTo(0, size*0.8);
        ctx.stroke();
      },
      // 10: Target / Vision 🎯
      (ctx, size) => {
        ctx.beginPath(); ctx.arc(0, 0, size*0.8, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, size*0.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, size*0.2, 0, Math.PI * 2); ctx.fill();
      }
    ];

    // ---------- 3D Orbit Node Objects ----------
    const numNodes = 10;
    const nodes = [];

    for (let i = 0; i < numNodes; i++) {
      const layerIndex = i % 3; // 0: near, 1: mid, 2: far
      let rx, ry, speed;

      if (layerIndex === 0) {
        rx = 340 + Math.random() * 80;
        ry = 160 + Math.random() * 40;
        speed = 0.008 + Math.random() * 0.004;
      } else if (layerIndex === 1) {
        rx = 480 + Math.random() * 90;
        ry = 220 + Math.random() * 50;
        speed = 0.005 + Math.random() * 0.003;
      } else {
        rx = 620 + Math.random() * 120;
        ry = 280 + Math.random() * 60;
        speed = 0.003 + Math.random() * 0.002;
      }

      nodes.push({
        iconIndex: i % ICONS.length,
        angle: (i / numNodes) * Math.PI * 2 + Math.random() * 0.5,
        rx: rx,
        ry: ry,
        tilt: (-25 + (i * 12)) * (Math.PI / 180), // Orbit inclination angle
        speed: speed * (i % 2 === 0 ? 1 : -1),
        size: 16 + (3 - layerIndex) * 6,
        selfRot: 0,
        selfRotSpeed: (Math.random() - 0.5) * 0.02,
        color: i % 2 === 0 ? '#c1794a' : '#e29d62'
      });
    }

    // ---------- Propelling Star Dust & Spark Particles ----------
    const numParticles = 75;
    const particles = [];

    function resetParticle(p, initialSpread = false) {
      const angle = Math.random() * Math.PI * 2;
      const dist = initialSpread ? Math.random() * 450 : 20 + Math.random() * 40;
      const speed = 0.6 + Math.random() * 2.2;

      p.x = Math.cos(angle) * dist;
      p.y = Math.sin(angle) * dist;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
      p.size = 1.2 + Math.random() * 2.5;
      p.alpha = 0.1 + Math.random() * 0.8;
      p.maxLife = 120 + Math.random() * 180;
      p.life = initialSpread ? Math.random() * p.maxLife : p.maxLife;
      p.color = Math.random() > 0.4 ? '#efe3ce' : (Math.random() > 0.5 ? '#c1794a' : '#e29d62');
      p.depth = -0.8 + Math.random() * 1.6; // Z depth ranging from -0.8 to 0.8
    }

    for (let i = 0; i < numParticles; i++) {
      const p = {};
      resetParticle(p, true);
      particles.push(p);
    }

    // Launch burst explosion trigger
    window.triggerLaunchBurst = function() {
      particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 8;
        p.x = (Math.random() - 0.5) * 60;
        p.y = (Math.random() - 0.5) * 60;
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
        p.life = p.maxLife;
        p.alpha = 1.0;
      });
    };

    // ---------- Main Render Animation Loop (60-120 FPS) ----------
    let currentBoost = 1.0;

    function animate() {
      // Smooth camera springlerp
      camX += (mouseX - camX) * 0.05;
      camY += (mouseY - camY) * 0.05;

      currentBoost += (speedBoost - currentBoost) * 0.05;

      // Clear both canvases
      bgCtx.clearRect(0, 0, width, height);
      fgCtx.clearRect(0, 0, width, height);

      // Render Ambient Orbit Rings on Background
      bgCtx.save();
      bgCtx.translate(cx + camX * 12, cy + camY * 12);
      bgCtx.lineWidth = 1;
      bgCtx.strokeStyle = 'rgba(193, 121, 74, 0.12)';
      bgCtx.setLineDash([6, 10]);

      [280, 420, 580].forEach(r => {
        bgCtx.beginPath();
        bgCtx.ellipse(0, 0, r, r * 0.45, -0.2, 0, Math.PI * 2);
        bgCtx.stroke();
      });
      bgCtx.restore();

      // Render Propelling Particles
      particles.forEach(p => {
        p.x += p.vx * currentBoost;
        p.y += p.vy * currentBoost;
        p.life -= 1;

        if (p.life <= 0 || Math.abs(p.x) > width / 1.2 || Math.abs(p.y) > height / 1.2) {
          resetParticle(p, false);
        }

        const lifeRatio = p.life / p.maxLife;
        const fadeAlpha = p.alpha * Math.sin(lifeRatio * Math.PI);
        const parallaxDepth = 15 * p.depth;

        // Depth projection
        const px = cx + p.x + camX * parallaxDepth;
        const py = cy + p.y + camY * parallaxDepth;

        // Choose target context based on depth Z
        const ctx = p.depth >= 0 ? fgCtx : bgCtx;

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, p.size * (0.8 + (p.depth + 1) * 0.3), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = fadeAlpha;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.restore();
      });

      // Render Orbiting 3D Venture Nodes
      nodes.forEach(node => {
        // Advance angle
        node.angle += node.speed * currentBoost;
        node.selfRot += node.selfRotSpeed;

        // 3D Orbital Parametric Equations with Tilt
        const cosA = Math.cos(node.angle);
        const sinA = Math.sin(node.angle);

        // Ellipse coordinates in 3D space
        const x3d = node.rx * cosA;
        const y3d = node.ry * sinA;

        // Rotate by tilt angle
        const cosT = Math.cos(node.tilt);
        const sinT = Math.sin(node.tilt);

        const xRot = x3d * cosT - y3d * sinT;
        const yRot = x3d * sinT + y3d * cosT;
        const zDepth = sinA; // Z depth index between -1 (far) and +1 (near)

        // Depth perspective scaling
        const perspective = (zDepth + 2.2) / 3.2; // Perspective scale 0.4 to 1.0
        const scale = perspective * (width < 640 ? 0.65 : 1.0);

        // Parallax screen coordinates
        const parallaxFactor = 25 * zDepth;
        const nodeX = cx + xRot + camX * parallaxFactor;
        const nodeY = cy + yRot * 0.6 + camY * parallaxFactor;

        // Occlusion decision: zDepth < 0 goes to bgCanvas (behind text), zDepth >= 0 goes to fgCanvas (in front of text)
        const ctx = zDepth >= 0 ? fgCtx : bgCtx;
        const isForeground = zDepth >= 0;

        ctx.save();
        ctx.translate(nodeX, nodeY);
        ctx.rotate(node.selfRot);
        ctx.scale(scale, scale);

        // Dynamic styling depending on depth
        ctx.lineWidth = isForeground ? 2.2 : 1.4;
        ctx.strokeStyle = node.color;
        ctx.fillStyle = node.color;
        ctx.globalAlpha = isForeground ? Math.min(1, 0.6 + zDepth * 0.4) : Math.max(0.2, 0.4 + zDepth * 0.3);
        ctx.shadowColor = node.color;
        ctx.shadowBlur = isForeground ? 14 : 4;

        // Render Vector Icon
        ICONS[node.iconIndex](ctx, node.size);

        ctx.restore();
      });

      requestAnimationFrame(animate);
    }

    // Start Animation Engine Loop
    requestAnimationFrame(animate);

  })();
</script>
